name: Check Locale Paths
description: 检查你的网站项目中是否意外的使用了本地路径。
author: 鸭鸭「カモ」(@DuckDuckStudio)

branding:
  color: green
  icon: check

inputs:
  formats:
    required: false
    description: 需要检查的文件的格式。以 , 分隔
    default: html,css,js,mjs,ts,mts

  skip_files:
    required: false
    description: 跳过的文件。

  skip_folders:
    required: false
    description: 跳过的文件夹。
    default: node_modules

runs:
  using: node24
  main: dist/index.mjs
